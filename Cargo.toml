[workspace]
resolver = "2"
# NOTE: crates/guest is deliberately NOT a workspace member — it is a standalone
# package (own [workspace] table) built exclusively through the `jolt` CLI for
# riscv64imac. This keeps guest feature resolution (native-keccak etc.) isolated
# from native host builds.
members = ["crates/core", "crates/host", "crates/inlines/blake2f", "crates/inlines/bn254", "crates/inlines/bls12-381"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
jeth-core = { path = "crates/core" }
# Custom inlines (opcode 0x2B, `InlineExtension::External`), registered with the tracer by jeth-host.
jeth-inlines-blake2f = { path = "crates/inlines/blake2f", default-features = false }

# stateless execution stack — zeth 0.3's proven pin set (PLAN.md §4)
stateless = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }
tries = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }
zeth-mpt = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }

# reth v2.1.0 (matches stateless rev 6e55612)
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-primitives-traits = { version = "0.3", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }

# alloy 2.x (matches reth v2.1.0 + stateless)
alloy-consensus = { version = "2.0", default-features = false }
alloy-eips = { version = "2.0", default-features = false }
alloy-genesis = { version = "2.0", default-features = false }
alloy-primitives = { version = "1.5", default-features = false }
alloy-rlp = { version = "0.3.8", default-features = false }
alloy-rpc-types-debug = { version = "2.0", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
revm-bytecode = { version = "10.0.0", default-features = false }
revm-database-interface = { version = "11.0.1", default-features = false }
revm-state = { version = "11.0.1", default-features = false }

# jolt branch `jolt-inlines-b` @ 3158917254 (private mirror 0xAndoroid/jolt-private) = jolt-amber-nolane @ a0d7b74baa
# + InlineExtension::External (tag for inlines registered by this repo); jolt-amber-nolane = a16z/jolt main f09bbc1e34
# + keccak-f θ/ρ fusion (a16z/jolt#1845, 3087→2511 rows/perm), `bump-alloc` sdk feature, secp256k1 sdk limb
# compares / MaybeUninit outputs — read-only worktree; the last three still need upstream PRs.
jolt-sdk = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-sdk" }
jolt-inlines-keccak256 = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/keccak256", default-features = false }
jolt-inlines-secp256k1 = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/secp256k1", default-features = false }
jolt-inlines-sha2 = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/sha2", default-features = false }
jolt-inlines-blake2 = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/blake2", default-features = false }
jolt-inlines-p256 = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/p256", default-features = false }
jolt-inlines-bigint = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/bigint", default-features = false }
jolt-inlines-sdk = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/jolt-inlines/sdk", default-features = false }
jeth-inlines-bls12-381 = { path = "crates/inlines/bls12-381", default-features = false }
tracer = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/tracer" }
jolt-common = { package = "common", path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/common" }
jolt-program = { path = "/Volumes/Dev/worktrees/jolt/jolt-inlines-b/crates/jolt-program" }

# misc
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
postcard = { version = "1.0.8", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
k256 = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

# jeth fork of zeth-mpt (inline slot children, in-place decode, zero-copy
# values) — see crates/vendor/zeth-mpt. Applies to jeth-core in this workspace; the guest
# workspace carries the same patch.
[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "crates/vendor/zeth-mpt" }

# Vendored ark-ff 0.5.0 with the guest-only bn254 inline hook (feature `jolt-bn254-inline`,
# riscv64 only): native builds compile the upstream code. Applies to every registry
# dependent (revm-precompile, ark-ec, ark-bn254, jeth-core); the a16z fork used by the jolt
# crates is a different source and is untouched.
[patch.crates-io]
ark-ff = { path = "crates/vendor/ark-ff" }
