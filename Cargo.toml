[workspace]
resolver = "2"
# NOTE: crates/guest is deliberately NOT a workspace member — it is a standalone
# package (own [workspace] table) built exclusively through the `jolt` CLI for
# riscv64imac. This keeps guest feature resolution (native-keccak etc.) isolated
# from native host builds.
members = ["crates/core", "crates/host", "crates/inlines/blake2f", "crates/inlines/bn254", "crates/inlines/bls12-381"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
jeth-core = { path = "crates/core" }
# Custom inlines (opcode 0x2B, `InlineExtension::External`), registered with the tracer by jeth-host.
jeth-inlines-blake2f = { path = "crates/inlines/blake2f", default-features = false }

# stateless execution stack — zeth 0.3's proven pin set (PLAN.md §4)
stateless = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }
tries = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }
zeth-mpt = { git = "https://github.com/paradigmxyz/stateless.git", rev = "6e55612" }

# reth v2.1.0 (matches stateless rev 6e55612)
reth-chainspec = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-consensus = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-forks = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-ethereum-primitives = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-evm = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-evm-ethereum = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-network-peers = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }
reth-primitives-traits = { version = "0.3", default-features = false }
reth-trie-common = { git = "https://github.com/paradigmxyz/reth.git", tag = "v2.1.0", default-features = false }

# alloy 2.x (matches reth v2.1.0 + stateless)
alloy-consensus = { version = "2.0", default-features = false }
alloy-eips = { version = "2.0", default-features = false }
alloy-genesis = { version = "2.0", default-features = false }
alloy-primitives = { version = "1.5", default-features = false }
alloy-rlp = { version = "0.3.8", default-features = false }
alloy-rpc-types-debug = { version = "2.0", default-features = false }
alloy-trie = { version = "0.9", default-features = false }
revm-bytecode = { version = "10.0.0", default-features = false }
revm-database-interface = { version = "11.0.1", default-features = false }
revm-state = { version = "11.0.1", default-features = false }

# a16z/jolt PR branch `feat/inline-extension-external` (main + `InlineExtension::External`), pinned by rev.
# No private commits: keccak θ/ρ fusion, `bump-alloc` and the secp256k1 sdk perf changes are not included.
jolt-sdk = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a" }
jolt-inlines-keccak256 = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-secp256k1 = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-sha2 = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-blake2 = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-p256 = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-bigint = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jolt-inlines-sdk = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a", default-features = false }
jeth-inlines-bls12-381 = { path = "crates/inlines/bls12-381", default-features = false }
tracer = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a" }
jolt-common = { package = "common", git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a" }
jolt-program = { git = "https://github.com/a16z/jolt", rev = "d4c3ca05db4664a004f13386219293841d01ba5a" }

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
postcard = { version = "1.0.8", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
k256 = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

# jeth fork of zeth-mpt (inline slot children, in-place decode, zero-copy
# values) — see crates/vendor/zeth-mpt. Applies to jeth-core in this workspace; the guest
# workspace carries the same patch.
[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "crates/vendor/zeth-mpt" }

# Vendored ark-ff 0.5.0 with the guest-only bn254 and BLS12-381 inline hooks (features
# `jolt-bn254-inline`, `jolt-bls12-381-inline`; riscv64 only): native builds compile the upstream
# code. Applies to every registry dependent (revm-precompile, ark-ec, ark-bn254, ark-bls12-381,
# jeth-core); the a16z fork used by the jolt crates is a different source and is untouched.
[patch.crates-io]
ark-ff = { path = "crates/vendor/ark-ff" }

[workspace.lints.rust]
# Guest pointer APIs and aligned reads require unsafe; explicit blocks mark each operation.
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
pedantic = { level = "warn", priority = -1 }

case_sensitive_file_extension_comparisons = "allow" # Repository inputs use fixed lowercase extensions.
default_trait_access = "allow" # Default types are clear at these call sites.
doc_markdown = "allow" # Domain notation need not use Rustdoc code spans.
double_must_use = "allow" # Generated trait wrappers can repeat this annotation.
fn_params_excessive_bools = "allow" # Independent flags mirror existing CLI and protocol inputs.
format_push_string = "allow" # Short diagnostic strings favor direct formatting.
implicit_hasher = "allow" # Map signatures keep the selected hasher explicit.
items_after_statements = "allow" # Local constants and helper items stay near their uses.
manual_let_else = "allow" # Equivalent match forms remain readable.
match_same_arms = "allow" # Separate protocol cases retain their domain meaning.
missing_errors_doc = "allow" # Error enums describe failures at their definitions.
missing_panics_doc = "allow" # Document invariants where they are enforced.
module_name_repetitions = "allow" # Qualified crypto names retain their meaning when imported.
must_use_candidate = "allow" # Do not annotate every getter.
needless_pass_by_value = "allow" # Keep existing ownership contracts.
no_effect_underscore_binding = "allow" # Named ignored bindings can document external contracts.
redundant_closure_for_method_calls = "allow" # Closures keep iterator intent local.
ref_option = "allow" # Borrowed option signatures follow existing APIs.
ref_option_ref = "allow" # Borrowed option signatures follow existing APIs.
return_self_not_must_use = "allow" # Builder return annotations are not required.
similar_names = "allow" # Crypto formulas use related operand names.
struct_excessive_bools = "allow" # Independent options are not mutually exclusive states.
too_many_lines = "allow" # Keep algorithms and report assembly in one place.
trivially_copy_pass_by_ref = "allow" # Preserve trait-compatible borrowed signatures.
uninlined_format_args = "allow" # Both formatting syntaxes are accepted.
unnecessary_wraps = "allow" # Uniform callback signatures may have infallible branches.
unused_async = "allow" # Async callback contracts can have synchronous implementations.
used_underscore_binding = "allow" # Conditional instrumentation may consume marked bindings.

cast_possible_truncation = "allow" # Fixed-width arithmetic intentionally selects low limbs.
cast_possible_wrap = "allow" # Signed instruction immediates preserve their bit patterns.
cast_precision_loss = "allow" # Profiler ratios intentionally use floating-point estimates.
cast_sign_loss = "allow" # Signed instruction encodings preserve their bit patterns.

expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

allow_attributes = "deny"

result_large_err = "allow" # Do not box errors solely to change their stack size.

dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
unimplemented = "deny"

enum_variant_names = "allow" # Protocol variants may share descriptive prefixes.
large_futures = "allow" # Future size changes require measurement.
significant_drop_tightening = "allow" # Resource lifetime changes require local reasoning.
