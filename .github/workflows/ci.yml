name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
          components: rustfmt
      # rustfmt directly: covers the standalone crates/guest package too and
      # needs no dependency fetch (vendor/ is upstream code and is excluded).
      - name: rustfmt --check
        run: |
          git ls-files 'crates/*.rs' ':!crates/vendor/**' \
            | xargs rustfmt --check --edition 2021

      - if: always()
        run: echo "rustfmt wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all --all-targets -q --message-format=short -- -D warnings
      - if: always()
        run: echo "clippy wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - if: always()
        run: echo "typos wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: scripts/lint/python.sh
      - if: always()
        run: echo "python lint wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"
