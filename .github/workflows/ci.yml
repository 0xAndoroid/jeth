name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
          components: rustfmt
      # rustfmt directly: covers the standalone crates/guest package too and
      # needs no dependency fetch (vendor/ is upstream code and is excluded).
      - name: rustfmt --check
        run: |
          git ls-files 'crates/*.rs' ':!crates/vendor/**' \
            | xargs rustfmt --check --edition 2021

      - if: always()
        run: echo "rustfmt wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 45 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --all --all-targets -q --message-format=short -- -D warnings
      - if: always()
        run: echo "clippy wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: host unit tests
    runs-on: ubicloud-standard-2-arm
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 60 }}
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo nextest run --workspace --locked --no-fail-fast
      - if: always()
        run: echo "test wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  riscv64:
    # The riscv64-only containing-word accesses (inline-asm loads/stores) in the
    # vendored crates and the guest shims only compile for the guest arch: run
    # their lib tests on riscv64 Linux under qemu (optimized, assertions on).
    name: riscv64 vendored tests (qemu)
    runs-on: ubuntu-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 10 || 30 }}
    env:
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: rust-lld
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUSTFLAGS: -C link-self-contained=yes -C target-feature=+crt-static
      CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_RUNNER: qemu-riscv64
      CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: "true"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master 2026-09-12
        with:
          toolchain: "1.95"
          targets: riscv64gc-unknown-linux-musl
      - uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2.87.19
        with:
          tool: nextest
      - run: sudo apt-get update -q && sudo apt-get install -yq qemu-user
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            crates/vendor/foldhash
            crates/vendor/hashbrown
            crates/vendor/alloy-primitives
            crates/vendor/revm-interpreter
            crates/vendor/zeth-mpt
            crates/guest/native-tests
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: lib tests (riscv64gc-unknown-linux-musl)
        run: |
          run() {
            cargo nextest run --locked --lib --no-fail-fast --release \
              --target riscv64gc-unknown-linux-musl --manifest-path "crates/$1/Cargo.toml"
          }
          for c in vendor/foldhash vendor/hashbrown vendor/alloy-primitives vendor/revm-interpreter vendor/zeth-mpt guest/native-tests; do
            run "$c"
          done
      - if: always()
        run: echo "riscv64 wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  typos:
    name: typos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: crate-ci/typos@00f422f3b19c57bc6338715ebfe3316d38768461 # v1.50.3

      - if: always()
        run: echo "typos wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: python lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: scripts/lint/python.sh
      - if: always()
        run: echo "python lint wall $(( $(date +%s) - JOB_START ))s" >> "$GITHUB_STEP_SUMMARY"

  ci:
    # always(), not !cancelled(): a skipped required check counts as passing, and
    # a cancelled run must still reach the exit 1 below.
    if: always()
    needs: [fmt, clippy, test, riscv64, typos, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - if: always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
        run: exit 1
