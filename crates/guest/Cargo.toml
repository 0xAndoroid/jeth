[package]
name = "jeth-guest"
version = "0.1.0"
edition = "2021"

# Standalone package (NOT part of the jeth workspace): built exclusively via the
# `jolt` CLI for riscv64imac-unknown-none-elf with `--features guest`. Keeping it
# out of the workspace isolates guest-only feature choices (alloy native-keccak)
# from native host builds.
[workspace]

[features]
default = ["keccak-census"]
guest = ["jeth-core/code-library"]
# Keccak census: per-call counters + `keccak[phase]` println lines in the
# normal `jeth trace` output (the `perms=` count is a campaign gate). Costs
# 21 rows per keccak call; `--no-default-features` drops it.
keccak-census = []
# Per-transaction cycle markers (drives `jeth txprofile`).
pertx = ["jeth-core/pertx-markers"]
# Defer bytecode analysis to first execution (A/B measurement for R2).
lazy = ["jeth-core/lazy-analysis"]
# Advice two-pass, pass-1 build (see jeth-core/compute_advice). The two builds
# are different ELFs; trace.rs builds and runs both.
compute_advice = ["jeth-core/compute_advice"]

[dependencies]
# `bump-alloc`: no-free bump heap (alloc ~10 rows, dealloc no-op, in-place realloc
# of the newest block) instead of the size-class allocator. Peak heap = total
# bytes ever allocated; the tracer aborts if a block exceeds the 1.5 GiB heap.
jolt = { package = "jolt-sdk", path = "/Volumes/Dev/worktrees/jolt/jolt-amber-nolane/jolt-sdk", features = ["bump-alloc"] }
jolt-inlines-keccak256 = { path = "/Volumes/Dev/worktrees/jolt/jolt-amber-nolane/jolt-inlines/keccak256", default-features = false }

jeth-core = { path = "../core", features = ["secp-inline", "sha2-inline", "blake2-inline", "p256-inline", "bigint-inline", "guest-instrument"] }
# Direct dependency only to reach the vendored crate's `bigint-inline` feature:
# EVM MULMOD through the `jeth_mul_mod` hook in lib.rs (always on, like the
# jeth-core inline features above).
revm-interpreter = { version = "35.0.1", default-features = false, features = ["bigint-inline"] }

# `native-keccak` routes every alloy keccak256 call (trie hashing, tx hashing, EVM
# KECCAK256 opcode, address derivation) to our `native_keccak256` shim → Jolt inline.
alloy-primitives = { version = "1.5", default-features = false, features = ["native-keccak"] }

serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }

# once_cell(critical-section) inside reth-primitives-traits needs a provider on
# bare metal; the Jolt guest is single-hart with no interrupts → no-op impl.
critical-section = "1.2"

# Word-wise Stack::exchange (SWAP1-16 measured at 16.9% of trace rows via the
# untyped byte-swap codegen). One-function patch; see crates/vendor/README.
#
# alloy-eip7702: EIP-7702 authority recovery routed through the Jolt secp256k1
# inline via the guest's jeth_ecrecover_prehash hook (software k256 measured at
# ~1.5M rows/authorization — 16% of block 25698070; the inline is ~230k).
[patch.crates-io]
revm-interpreter = { path = "../vendor/revm-interpreter" }
alloy-eip7702 = { path = "../vendor/alloy-eip7702" }
# Fixed foldhash seeds (design law L5): hashbrown iteration order must be
# identical across the compute_advice/proven ELF pair — upstream seeds from
# stack/fn/static addresses, which differ between two ELFs. Guest-only patch.
foldhash = { path = "../vendor/foldhash" }

# zeth-mpt fork: inline slot children (digest stubs unboxed), in-place node
# decode + zero-copy values (Bytes::slice_ref views into witness node bytes) —
# decode-driven struct moves + value copies measured ~190M rows across
# reveal/execution/post_root. Same patch in the root workspace so the native
# gate runs identical trie code.
[patch."https://github.com/paradigmxyz/stateless.git"]
zeth-mpt = { path = "../vendor/zeth-mpt" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[lib]
test = false
doctest = false
bench = false

[[bin]]
name = "jeth-guest"
path = "src/main.rs"
test = false
bench = false
