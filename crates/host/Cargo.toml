[package]
name = "jeth-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "jeth"
path = "src/main.rs"

[features]
default = ["code-library"]
code-library = ["jeth-core/code-library"]
# §8.1 pre-measurement report after run-native (see jeth-core/premeasure).
premeasure = ["jeth-core/premeasure"]
secp-inline = ["jeth-core/secp-inline"]

[dependencies]
jeth-core = { workspace = true, features = ["std"] }

reth-ethereum-primitives = { workspace = true, features = ["std", "serde"] }
reth-primitives-traits = { workspace = true, features = ["std"] }
# `merge`: host-side execution (same trie/witness DB/executor as the guest loop)
# + header derivation rules; all already built for jeth-core.
reth-chainspec.workspace = true
reth-evm.workspace = true
tries.workspace = true
alloy-eips.workspace = true
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std", "serde", "k256"] }
alloy-rlp.workspace = true
revm-bytecode.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }

serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
anyhow.workspace = true
clap.workspace = true
ureq.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# jolt tracer stack (path deps into the read-only keccak-9340a77 worktree).
# jolt-inlines-keccak256 "host" registers the inline's opcode handler with the
# tracer via inventory — without it the emulator panics on the guest's keccak insn.
tracer.workspace = true
jolt-common.workspace = true
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-secp256k1 = { workspace = true, features = ["host"] }

# profiler: guest ELF symbolization
object = "0.36"
rustc-demangle = "0.1"
# txprofile: cycle-marker report parsing
regex-lite = "0.1"

[dev-dependencies]
# merge tests: validate the synthetic header with the consensus rules the guest applies.
reth-consensus.workspace = true
reth-ethereum-consensus.workspace = true
