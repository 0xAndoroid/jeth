[package]
name = "jeth-host"
version.workspace = true
edition.workspace = true

[[bin]]
name = "jeth"
path = "src/main.rs"

[dependencies]
jeth-core.workspace = true

reth-ethereum-primitives = { workspace = true, features = ["std", "serde"] }
reth-primitives-traits = { workspace = true, features = ["std"] }
alloy-consensus = { workspace = true, features = ["std"] }
alloy-primitives = { workspace = true, features = ["std", "serde", "k256"] }
alloy-rlp.workspace = true
k256 = { workspace = true, features = ["ecdsa"] }

serde = { workspace = true, features = ["std"] }
serde_json.workspace = true
postcard = { workspace = true, features = ["use-std"] }
anyhow.workspace = true
clap.workspace = true
ureq.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# jolt tracer stack (path deps into the read-only merge-1717-main worktree).
# jolt-inlines-keccak256 "host" registers the inline's opcode handler with the
# tracer via inventory — without it the emulator panics on the guest's keccak insn.
tracer.workspace = true
jolt-common.workspace = true
jolt-inlines-keccak256 = { workspace = true, features = ["host"] }
jolt-inlines-secp256k1 = { workspace = true, features = ["host"] }

# profiler: guest ELF symbolization
object = "0.36"
rustc-demangle = "0.1"
