# jeth fork of paradigmxyz/stateless crates/zeth-mpt @ 6e55612 (Apache-2.0,
# Copyright 2025 RISC Zero, Inc.). Applied via [patch] of the git dependency.
#
# Changes vs upstream (profile-driven, block 25698189):
# - Branch children are 16 inline 40-byte slots (Empty / inline Digest /
#   boxed Node): unresolved children cost no heap node, and nodes are decoded
#   in place into their final slot (decode_node_zc_into) — moving a node by
#   value (decode return, Box::new, *self = node) was a large share of the
#   129M decode-driven memcpy rows.
# - Zero-copy decode: leaf/branch values become Bytes::slice_ref views into the
#   witness node bytes instead of allocated copies (resolve_digests path, the
#   only decode path jeth exercises).
# - serde/rkyv/orphan support dropped (unused by jeth).
[package]
name = "zeth-mpt"
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"

# Standalone patch target (applied via [patch] in both the jeth workspace and
# the guest workspace), like crates/vendor/revm-interpreter.
[workspace]

[dependencies]
alloy-trie = { version = "0.9", default-features = false, features = ["ethereum"] }
alloy-rlp = { version = "0.3.8", default-features = false }
alloy-primitives = { version = "1.5", default-features = false, features = ["map-foldhash", "map-indexmap"] }

# Inert feature names (upstream cfg_attr gates reference them; never enabled).
[features]
# Advice two-pass, pass-1 build (arena-encoder length advice — Phase 3a).
# The cfg resolves in the defining crate; jeth-core forwards it.
compute_advice = []
# §8.1 pre-measurement counters (native runs only; never in guest builds).
premeasure = []
serde = []
rkyv = []
orphan = []
rlp_serialize = []

# Advice tape IO intrinsics; riscv64-only (native builds never touch jolt-sdk).
[target.'cfg(target_arch = "riscv64")'.dependencies]
jolt = { package = "jolt-sdk", path = "/Volumes/Dev/worktrees/jolt/jolt-amber/jolt-sdk", default-features = false }
