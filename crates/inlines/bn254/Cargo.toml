[package]
name = "jeth-inlines-bn254"
version.workspace = true
edition.workspace = true

[features]
default = []
host = ["jolt-inlines-sdk/host"]

[dependencies]
jolt-inlines-sdk = { workspace = true }

[dev-dependencies]
jeth-inlines-bn254 = { path = ".", features = ["host"] }
jolt-inlines-sdk = { workspace = true, features = ["test-utils"] }
tracer = { workspace = true, features = ["std", "test-utils"] }
ark-bn254 = { version = "0.5.0", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5.0", default-features = false }
num-bigint = "0.4"
rand = "0.8"
