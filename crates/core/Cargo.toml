[package]
name = "jeth-core"
version.workspace = true
edition.workspace = true

[features]
# Verify tx signatures with the Jolt secp256k1 inline (guest builds only; native
# builds keep alloy/k256). The inline SDK panics if called on a non-RISC-V target.
# Also installs the alloy-consensus pluggable crypto backend so EIP-7702
# authority recovery (via alloy-evm's TxEnv conversion) hits the inline too.
secp-inline = ["dep:jolt-inlines-secp256k1", "alloy-consensus/crypto-backend"]
# Phase markers + keccak checkpoints around trie reveal/root (guest builds only;
# the binary must provide the jeth_phase_start/end extern hooks).
guest-instrument = []
# Cycle marker around every transaction (drives `jeth txprofile`).
pertx-markers = ["guest-instrument"]
# Defer bytecode analysis to first execution instead of analyzing every witness
# code up front (upstream stateless HEAD behavior).
lazy-analysis = []
# §8.1 pre-measurement counters + phase snapshots (native runs only).
premeasure = ["zeth-mpt/premeasure"]
# Advice two-pass, pass-1 build: #[cfg] resolves in the DEFINING crate, so the
# feature lives here and the guest forwards it. Pass-1 ELF runs advice bodies
# and writes the tape; the proven ELF reads it (crates/core/src/advice.rs).
compute_advice = []

[dependencies]
stateless.workspace = true
tries.workspace = true
zeth-mpt.workspace = true
jolt-inlines-secp256k1 = { workspace = true, optional = true }

alloy-rpc-types-debug.workspace = true
alloy-trie.workspace = true
reth-trie-common.workspace = true
revm-bytecode.workspace = true

reth-chainspec.workspace = true
reth-consensus.workspace = true
reth-ethereum-consensus.workspace = true
reth-ethereum-forks.workspace = true
reth-ethereum-primitives = { workspace = true, features = ["serde"] }
reth-evm.workspace = true
reth-evm-ethereum.workspace = true
reth-network-peers.workspace = true
reth-primitives-traits.workspace = true
revm-database-interface.workspace = true
revm-state.workspace = true

alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-genesis.workspace = true
alloy-primitives.workspace = true
alloy-rlp.workspace = true

serde.workspace = true

# Advice tape IO intrinsics (AdviceReader/Writer, check_advice!). riscv64-only:
# native builds never touch jolt-sdk — the native gate calls advice bodies
# directly (see src/advice.rs build matrix).
[target.'cfg(target_arch = "riscv64")'.dependencies]
jolt = { package = "jolt-sdk", path = "/Volumes/Dev/worktrees/jolt/merge-1717-main/jolt-sdk", default-features = false }
